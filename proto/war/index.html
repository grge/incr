<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Topple — Skirmish prototype</title>
  <meta name="theme-color" content="#16120e">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2316120e'/%3E%3Cpath d='M9 6h14l-7 10z' fill='%23e8b86a'/%3E%3Cpath d='M9 26h14l-7-10z' fill='%237fb0f4'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="war.css">
</head>
<body>
  <header id="top">
    <div class="brand"><span class="logo">⧗</span><h1>Topple</h1><span class="tag">Skirmish · prototype</span></div>
    <div id="score">
      <div class="sides"><span class="you">You</span><span id="goal" class="muted small"></span><span class="rival">Rival</span></div>
      <div id="bar"><div id="barYou"></div><div id="barRival"></div><div id="mark"></div></div>
      <div class="sides small"><span id="youStat" class="you"></span><span id="rivalStat" class="rival"></span></div>
    </div>
    <div id="clock" class="muted small"></div>
  </header>
  <main id="main">
    <section id="stage">
      <div id="boardWrap"><canvas id="board" aria-label="The battlefield"></canvas><div id="hint" class="hidden"></div></div>
      <div id="sel" class="hidden"></div>
      <div id="info">&nbsp;</div>
    </section>
    <aside id="panel"></aside>
  </main>
  <div id="toasts" aria-live="polite"></div>
  <div id="modal" class="hidden" role="dialog" aria-modal="true"><div id="modalCard"></div></div>
  <noscript><p style="padding:2em;color:#ddd">This prototype needs JavaScript.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
